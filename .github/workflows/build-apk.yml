name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Base Project & Configure
        run: |
          flutter create --org com.synccal --project-name synccal_ai app_project
          cd app_project
          # 안전한 버전으로 패키지 추가
          flutter pub add intl http timezone
          
          # Android 매니페스트 권한 자동 삽입
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Build Galaxy Debug APK
        run: |
          cd app_project
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncCal_AI_Galaxy_APK
          path: app_project/build/app/outputs/flutter-apk/app-debug.apk
